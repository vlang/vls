name: CI

on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout V
        uses: actions/checkout@v5
        with:
          repository: vlang/v
      - name: Checkout VLS
        uses: actions/checkout@v5
        with:
          path: vls

      # The build fetches the matching vlang/vc bootstrap snapshot itself, so
      # nothing here is pinned and every run tests against the latest compiler.
      - name: Build V
        if: runner.os != 'Windows'
        run: make latest_tcc && make -j4 && ./v symlink
      - name: Build V (Windows)
        if: runner.os == 'Windows'
        run: ./makev.bat latest_tcc && ./makev.bat && ./v symlink

      # Hover, completion, signature help, and go to definition run through
      # `-line-info`, which only the compatibility compiler implements now that
      # V3 is the default backend. `makev.bat` already builds it on Windows.
      - name: Build the V compatibility compiler
        if: runner.os != 'Windows'
        run: make v1

      - name: Check formatting
        run: v fmt -verify vls/

      - name: Run all tests, including the vlang/v workspace tests
        env:
          VLS_VLANG_V_REPO: ${{ github.workspace }}
          V_MACOS_V3_NO_FALLBACK: ${{ runner.os == 'Windows' && '0' || '1' }}
        run: v -no-memory-limit -nocache test vls/

      # `-prod` drops assert statements, which silently changes the behaviour of
      # any test that performs work inside one. That reached Windows as a hang in
      # test_stdio_reader_processes_frame_before_eof, invisible here because -prod
      # only ran on Linux. Keep a bounded step on both, so a future hang is a red
      # build instead of a job that burns its whole budget.
      - name: Run tests with production optimizations (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 30
        env:
          V_MACOS_V3_NO_FALLBACK: "0"
        run: v -no-memory-limit -nocache -prod test vls/

      - name: Run tests with production optimizations
        if: runner.os == 'Linux'
        timeout-minutes: 30
        env:
          VLS_VLANG_V_REPO: ${{ github.workspace }}
          V_MACOS_V3_NO_FALLBACK: "1"
        run: v -no-memory-limit -nocache -prod test vls/

      - name: Compile project with V3
        if: runner.os != 'Windows'
        env:
          V_MACOS_V3_NO_FALLBACK: "1"
        run: v -no-memory-limit -nocache -new-compiler vls/

      - name: Compile project
        if: runner.os == 'Windows'
        run: v -nocache vls/
