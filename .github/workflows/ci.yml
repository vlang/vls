name: CI

on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout V
        uses: actions/checkout@v5
        with:
          repository: vlang/v
      - name: Checkout VLS
        uses: actions/checkout@v5
        with:
          path: vls

      - name: Build V
        if: runner.os != 'Windows'
        run: make -j4 && ./v symlink
      - name: Build V (Windows)
        if: runner.os == 'Windows'
        run: ./makev.bat && ./v symlink

      - name: Check formatting
        run: v fmt -verify vls/

      - name: Run all tests, including the vlang/v workspace tests
        env:
          VLS_VLANG_V_REPO: ${{ github.workspace }}
        run: v test vls/

      - name: Compile project
        run: v vls/
