name: CI

on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout V
        uses: actions/checkout@v5
        with:
          repository: vlang/v
          # Pin the V3-default compiler revision for reproducible integration coverage.
          ref: 1a1d7f09d579dcdc8773a29384a10f2e02436591
      - name: Checkout matching V bootstrap
        uses: actions/checkout@v5
        with:
          repository: vlang/vc
          # Generated by the pinned V revision above.
          ref: b37fcfa1f63ab4ab85dedc34c554b942db9d3025
          path: vc
      - name: Checkout VLS
        uses: actions/checkout@v5
        with:
          path: vls

      - name: Build V
        if: runner.os != 'Windows'
        run: make latest_tcc && make local=1 -j4 && ./v symlink
      - name: Build V (Windows)
        if: runner.os == 'Windows'
        run: ./makev.bat latest_tcc && ./makev.bat --local && ./v symlink

      - name: Check formatting
        run: v fmt -verify vls/

      - name: Run all tests, including the vlang/v workspace tests
        env:
          VLS_VLANG_V_REPO: ${{ github.workspace }}
          V_MACOS_V3_NO_FALLBACK: "1"
        run: v -no-memory-limit test vls/

      - name: Compile project with V3
        if: runner.os != 'Windows'
        env:
          V_MACOS_V3_NO_FALLBACK: "1"
        run: v -no-memory-limit -new-compiler vls/

      - name: Compile project
        if: runner.os == 'Windows'
        run: v vls/

  vscode-extension:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VLS
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Test extension
        working-directory: vscode-extension
        run: npm test

      - name: Package extension
        working-directory: vscode-extension
        run: npm run build -- --out /tmp/vls-ci.vsix
